[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taxnet"
version = "0.2.0"
description = "TaxNet XAI — Pakistan-first tax fraud detection prototype"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost-cpu>=2.0,<3.0",
    "shap>=0.45",
    "falkordb>=1.0",
    "openpyxl>=3.1.5",
    "polars>=1.41.2",
    "blockingpy>=0.2.8",
    "model2vec>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["taxnet"]

[tool.ruff]
line-length = 120
